<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Performance - High Fidelity</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #06070a;
            --card-bg: #0f111a;
            --accent: #03dac6;
            --purple: #bb86fc;
            --orange: #ff5252;
            --border: #1e2235;
            --text-main: #ffffff;
            --text-dim: #94a3b8;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .container {
            display: grid;
            grid-template-columns: 380px 1fr;
            width: 100%;
            height: 100vh;
        }

        /* SIDEBAR */
        .sidebar {
            background-color: var(--card-bg);
            border-right: 1px solid var(--border);
            padding: 15px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .section-label { 
            color: var(--accent); 
            font-size: 0.65rem; 
            text-transform: uppercase; 
            letter-spacing: 2px;
            margin: 15px 0 8px 0;
            font-weight: 800;
        }

        .staff-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 4px;
            margin-bottom: 12px;
        }

        .staff-item {
            font-size: 0.62rem; background: #1a1e2e; padding: 5px;
            border-radius: 4px; cursor: pointer; display: flex; align-items: center;
            text-transform: capitalize; border: 1px solid transparent;
        }
        .staff-item:hover { border-color: var(--purple); }
        .staff-item input { margin-right: 4px; accent-color: var(--accent); }

        /* DATA ENTRY TABLES */
        .entry-container { margin-top: 10px; }
        .table-title { font-size: 0.7rem; color: var(--text-dim); margin-bottom: 5px; font-weight: bold; }
        table { width: 100%; border-collapse: collapse; font-size: 0.65rem; margin-bottom: 15px; }
        th { text-align: left; padding: 4px; color: var(--accent); border-bottom: 1px solid var(--border); }
        td { padding: 4px; border-bottom: 1px solid #1a1e2e; }
        .edit-in { 
            width: 32px; background: #000; color: #fff; border: 1px solid #334155; 
            text-align: center; border-radius: 2px; outline: none; font-size: 0.65rem;
        }

        /* MAIN CONTENT */
        .main-content {
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .report-block {
            background: #0a0c14;
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .report-header {
            font-size: 0.9rem;
            font-weight: 700;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            letter-spacing: 0.5px;
        }

        .bar-wrap { height: 200px; width: 100%; margin-bottom: 30px; }

        .pie-flex-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
        }

        .individual-pie-card {
            background: #111420;
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 15px;
            height: 180px;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow: hidden;
        }

        .pie-title {
            font-size: 0.75rem;
            font-weight: 600;
            text-transform: capitalize;
            color: #fff;
            margin-bottom: 10px;
        }

        .canvas-container {
            width: 100%;
            height: 100%;
            position: relative;
            flex: 1;
        }

        .perc-label {
            position: absolute;
            top: 58%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 0.9rem;
            font-weight: 800;
            text-shadow: 0 0 10px rgba(255,255,255,0.2);
        }

        button.gen-btn {
            background: linear-gradient(135deg, var(--accent), #02b3a3);
            color: #000; border: none; padding: 12px;
            width: 100%; font-weight: 800; border-radius: 8px; cursor: pointer;
            margin-bottom: 20px; text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="sidebar">
        <span class="section-label">Shift Configuration</span>
        <select id="shiftSelect" style="width:100%; padding:8px; background:#000; color:#fff; border:1px solid var(--border); border-radius:4px; margin-bottom:15px;">
            <option>MORNING SHIFT</option>
            <option>EVENING SHIFT</option>
            <option>NIGHT SHIFT</option>
        </select>

        <span class="section-label">Analog Insertion Team</span>
        <div class="staff-grid" id="analogGrid">
            <script>
                ["rajitha", "reshma", "ajeeshna", "cinju", "selbin", "aksa"].forEach(n => {
                    document.write(`<label class="staff-item"><input type="checkbox" class="a-check" value="${n}"> ${n}</label>`);
                });
            </script>
        </div>

        <span class="section-label">Technicians Team</span>
        <div class="staff-grid" id="techGrid">
            <script>
                ["ambily", "hari", "manu", "radha", "josna", "akshara", "haritha", "jishnu", "adarsh", "vincy", "elmy", "ashna", "anju", "navya"].forEach(n => {
                    document.write(`<label class="staff-item"><input type="checkbox" class="t-check" value="${n}"> ${n}</label>`);
                });
            </script>
        </div>

        <button class="gen-btn" onclick="buildDashboard()">Refresh Reports</button>

        <!-- SEPARATE MANUAL DATA INPUTS -->
        <div class="entry-container">
            <div class="table-title">Analog Entry</div>
            <table id="analogTable">
                <thead><tr><th>Name</th><th>TGT</th><th>ACH</th><th>M</th><th>D</th><th>C</th></tr></thead>
                <tbody id="analogBody"></tbody>
            </table>

            <div class="table-title">Technician Entry</div>
            <table id="techTable">
                <thead><tr><th>Name</th><th>TGT</th><th>ACH</th><th>M</th><th>D</th><th>C</th></tr></thead>
                <tbody id="techBody"></tbody>
            </table>
        </div>
    </div>

    <div class="main-content">
        <div id="analogSec" class="report-block" style="display:none;">
            <div class="report-header" style="color: var(--orange);">ANALOG INSERTION ANALYSIS</div>
            <div class="bar-wrap"><canvas id="analogBar"></canvas></div>
            <div class="pie-flex-grid" id="analogGallery"></div>
        </div>

        <div id="techSec" class="report-block" style="display:none;">
            <div class="report-header" style="color: var(--purple);">GENERAL TECHNICIAN ANALYSIS</div>
            <div class="bar-wrap"><canvas id="techBar"></canvas></div>
            <div class="pie-flex-grid" id="techGallery"></div>
        </div>
    </div>
</div>

<script>
    let charts = {};

    function buildDashboard() {
        const aChecked = document.querySelectorAll('.a-check:checked');
        const tChecked = document.querySelectorAll('.t-check:checked');
        
        const setupTable = (checks, bodyId, cat) => {
            const body = document.getElementById(bodyId);
            body.innerHTML = '';
            checks.forEach(c => {
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td style="text-transform:capitalize">${c.value}</td>
                    <td><input type="number" class="edit-in tgt" oninput="refresh()"></td>
                    <td><input type="number" class="edit-in ach" oninput="refresh()"></td>
                    <td><input type="number" class="edit-in m" oninput="refresh()"></td>
                    <td><input type="number" class="edit-in d" oninput="refresh()"></td>
                    <td><input type="number" class="edit-in c" oninput="refresh()"></td>
                `;
                body.appendChild(tr);
            });
        };

        setupTable(aChecked, 'analogBody', 'analog');
        setupTable(tChecked, 'techBody', 'tech');

        document.getElementById('analogSec').style.display = aChecked.length ? 'block' : 'none';
        document.getElementById('techSec').style.display = tChecked.length ? 'block' : 'none';
        refresh();
    }

    function refresh() {
        const process = (bodyId) => {
            const data = { labels: [], tgts: [], achs: [], items: [] };
            document.querySelectorAll(`#${bodyId} tr`).forEach(row => {
                const name = row.cells[0].innerText;
                const tgt = parseFloat(row.querySelector('.tgt').value) || 0;
                const ach = parseFloat(row.querySelector('.ach').value) || 0;
                const m = parseFloat(row.querySelector('.m').value) || 0;
                const d = parseFloat(row.querySelector('.d').value) || 0;
                const c = parseFloat(row.querySelector('.c').value) || 0;
                data.labels.push(name);
                data.tgts.push(tgt);
                data.achs.push(ach);
                data.items.push({ name, vals: [m, d, c], perc: tgt > 0 ? Math.round((ach/tgt)*100) : 0 });
            });
            return data;
        };

        renderGroup('analog', process('analogBody'), '#ff5252');
        renderGroup('tech', process('techBody'), '#bb86fc');
    }

    function renderGroup(id, data, color) {
        // Bar Chart with Normal Width
        const bCtx = document.getElementById(id + 'Bar').getContext('2d');
        if (charts[id + 'Bar']) charts[id + 'Bar'].destroy();
        charts[id + 'Bar'] = new Chart(bCtx, {
            type: 'bar',
            data: {
                labels: data.labels,
                datasets: [
                    { label: 'Target', data: data.tgts, backgroundColor: '#1e293b', barPercentage: 0.6 },
                    { label: 'Achieved', data: data.achs, backgroundColor: color, barPercentage: 0.6 }
                ]
            },
            options: { maintainAspectRatio: false, plugins: { legend: { display: false } } }
        });

        // Pie Gallery with Callout Style
        const gall = document.getElementById(id + 'Gallery');
        gall.innerHTML = '';
        data.items.forEach((item, i) => {
            const cid = `${id}_p_${i}`;
            const card = document.createElement('div');
            card.className = 'individual-pie-card';
            card.innerHTML = `
                <div class="pie-title">${item.name}</div>
                <div class="canvas-container"><canvas id="${cid}"></canvas></div>
                <div class="perc-label" style="color:${color}">${item.perc}%</div>
            `;
            gall.appendChild(card);

            new Chart(document.getElementById(cid), {
                type: 'doughnut',
                data: {
                    labels: ['M', 'D', 'C'],
                    datasets: [{
                        data: item.vals,
                        backgroundColor: [color, '#00e5ff', '#ffeb3b'],
                        borderWidth: 0,
                        hoverOffset: 10
                    }]
                },
                options: {
                    maintainAspectRatio: false,
                    cutout: '80%',
                    plugins: { 
                        legend: { display: true, position: 'right', labels: { color: '#fff', font: { size: 9 }, boxWidth: 8 } } 
                    }
                }
            });
        });
    }

    window.onload = buildDashboard;
</script>
</body>
</html>
